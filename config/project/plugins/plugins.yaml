    regenerateSitemapsAutomatically: true
    renderEnabled: true
    separatorChar: '|'
    sidebarDisplayPreviewTypes:
      - google
      - twitter
      - facebook
    siteGroupsSeparate: true
    siteUrlOverride: ''
    sitemapsEnabled: true
    socialMediaPreviewTarget: true
    submitSitemaps: true
    truncateDescriptionTags: true
    truncateTitleTags: true
    xDefaultSite: 0
